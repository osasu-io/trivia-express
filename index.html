<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trivia Vault</title>
</head>
<body>
  <h1>Trivia Vault</h1>
  <h2>Save a Trivia Question</h2>

  <form action="/trivia" method="POST">
    <input type="text" placeholder="Trivia question" name="question">
    <input type="text" placeholder="Answer" name="answer">
    <input type="text" placeholder="Category" name="category">
    <input type="text" placeholder="Difficulty" name="difficulty">
    <button type="submit">Submit</button>
  </form>

</body>
</html>
